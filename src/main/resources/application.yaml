spring:

  application:
    name: gateway_auth_service
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      uri: mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:mongo_secret}@localhost:27017/${MONGO_DB:auth_reports}?authSource=admin
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/${SECURITY_DB_NAME:auth_gateway}
    username: ${SECURITY_DB_USER:postgres}
    password: ${SECURITY_DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    default-schema: public

logging:
  level:
    org:
      springframework:
        orm:
          jpa: INFO
        JpaTransactionManager: DEBUG
        transaction: INFO
        interceptor: TRACE

app:
  jwt:
    secret: ${APP_SECRET}
    expiration:
      access: 15m
      refresh: 180d